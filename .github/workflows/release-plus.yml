name: release plus

# Publishes a Plus release for every tag of the form plus-<core>-<plus>, e.g. plus-2.9-1.0.
#
# Upstream's own release.yml only runs for releases published from the master branch, so it stays
# silent for these tags. This workflow therefore mirrors upstream's packaging jobs (jpackage +
# Inno Setup) itself and ships exactly the same set of artefacts:
#
#   windows  mca-selector-plus-<core>-plus-<plus>-setup.exe
#   macOS    mca-selector-plus-<core>-plus-<plus>-aarch64.dmg / -x64.dmg
#   linux    mca-selector-plus-<core>-plus-<plus>-x64.deb   / -aarch64.deb
#            mca-selector-plus-<core>-plus-<plus>-x64.rpm   / -aarch64.rpm
#   jar      mca-selector-plus-<core>-plus-<plus>-all.jar   (fat, needs JDK 21 + JavaFX)
#            mca-selector-plus-<core>-plus-<plus>.jar       (min, needs the jpackage lib/ folder)

on:
  push:
    tags:
      - 'plus-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.v.outputs.core }}
      plus: ${{ steps.v.outputs.plus }}
      base: ${{ steps.v.outputs.base }}
    steps:
      - uses: actions/checkout@v4

      - name: read the versions
        id: v
        run: |
          core=$(grep -E '^version=' gradle.properties | head -1 | cut -d= -f2 | tr -d '\r ')
          plus=$(grep -E '^plus\.version=' gradle.properties | head -1 | cut -d= -f2 | tr -d '\r ')
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "plus=$plus" >> "$GITHUB_OUTPUT"
          echo "base=mca-selector-plus-$core-plus-$plus" >> "$GITHUB_OUTPUT"

  jars:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: set up jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          java-package: jdk+fx

      - name: build the jars
        run: ./gradlew --no-daemon assemble shadowJar -x test

      - name: check the versions inside the fat jar
        run: unzip -p build/libs/*-all.jar META-INF/MANIFEST.MF | grep -E 'Application-Version|Plus-Version'

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error

  windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: set up jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          java-package: jdk+fx
          architecture: x64

      - name: build the jpackage image
        shell: bash
        run: |
          set -o pipefail
          {
            ./gradlew assemble shadowJar -x test --stacktrace --warning-mode all
            ./gradlew jpackage --stacktrace --warning-mode all
          } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: initialise the installer resources
        shell: bash
        run: ./installer/windows/init .

      - name: fetch the unofficial chinese language files
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ver = (Get-Item $iscc).VersionInfo.ProductVersion
          $tag = "is-" + (($ver.Split('.')[0..2]) -join '_')
          Write-Host "iscc $ver, language files from issrc tag $tag"
          $dir = "build\inno\Languages\Unofficial"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($lang in 'ChineseSimplified', 'ChineseTraditional') {
            $url = "https://raw.githubusercontent.com/jrsoftware/issrc/$tag/Files/Languages/$lang.isl"
            try {
              Invoke-WebRequest -Uri $url -OutFile "$dir\$lang.isl" -UseBasicParsing -ErrorAction Stop
              Write-Host "fetched $lang.isl"
            } catch {
              # the tag for this exact iscc build may not be published yet: drop the two
              # unofficial entries instead of failing the whole installer build
              Write-Warning "could not fetch $lang.isl from $url, removing the entry from inno.iss"
              (Get-Content build\inno\inno.iss) | Where-Object { $_ -notmatch [regex]::Escape("Unofficial\$lang") } | Set-Content build\inno\inno.iss
            }
          }

      - name: build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "iscc not found at $iscc" }
          & $iscc build\inno\inno.iss /Q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/iscc.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP/iscc.log" | Write-Host
            throw "iscc exited with $LASTEXITCODE"
          }
          Get-ChildItem build\inno\Output

      - name: list the output
        shell: bash
        run: ls -l build/inno/Output/

      - name: ship the build log on failure
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p .ci-logs
          git config user.email ci@local
          git config user.name ci
          {
            echo "job: $GITHUB_JOB run: $GITHUB_RUN_ID"
            tail -c 20000 "$RUNNER_TEMP/build.log" 2>/dev/null
            echo "===== iscc ====="
            cat "$RUNNER_TEMP/iscc.log" 2>/dev/null
          } > ".ci-logs/windows.log"
          git add -f .ci-logs
          git commit -q -m "ci log windows" || true
          git push -q -f origin HEAD:refs/heads/ci-log-windows || true

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/inno/Output/*.exe
          if-no-files-found: error

  macos:
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-26-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: set up jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          java-package: jdk+fx
          architecture: ${{ matrix.arch }}

      - name: build the dmg
        run: |
          chmod +x ./gradlew ./installer/init
          ./gradlew assemble shadowJar -x test --stacktrace --warning-mode all
          mkdir -p build/licenses
          ./installer/init . build/licenses/LICENSE
          ./gradlew jpackage --stacktrace --warning-mode all
          ls -l build/jpackage/

      - name: rename the dmg
        run: |
          cd build/jpackage
          mv ./*.dmg "${{ needs.meta.outputs.base }}-${{ matrix.arch }}.dmg"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: build/jpackage/*.dmg
          if-no-files-found: error

  linux:
    needs: meta
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            type: deb
            image: debian:bookworm
          - os: ubuntu-22.04-arm
            arch: aarch64
            type: deb
            image: debian:bookworm
          - os: ubuntu-22.04
            arch: x64
            type: rpm
            image: fedora:latest
          - os: ubuntu-22.04-arm
            arch: aarch64
            type: rpm
            image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: install the packaging tools (deb)
        if: matrix.type == 'deb'
        run: |
          apt-get update -qq
          apt-get install -qq -y ca-certificates git findutils binutils fakeroot debhelper

      - name: install the packaging tools (rpm)
        if: matrix.type == 'rpm'
        run: |
          dnf install -y git findutils tar gzip binutils which rpm-build

      - name: set up jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          java-package: jdk+fx
          architecture: ${{ matrix.arch }}

      - name: build the installer
        run: |
          set -o pipefail
          chmod +x ./gradlew ./installer/init
          {
            ./gradlew assemble shadowJar -x test --stacktrace --warning-mode all
            mkdir -p build/licenses
            ./installer/init . build/licenses/LICENSE
            ./gradlew jpackage -PmatrixType=${{ matrix.type }} --stacktrace --warning-mode all
            mv build/jpackage/*.${{ matrix.type }} "${{ needs.meta.outputs.base }}-${{ matrix.arch }}.${{ matrix.type }}"
            ls -l build/jpackage/
          } 2>&1 | tee /tmp/build.log

      - name: ship the build log on failure
        if: failure()
        run: |
          set +e
          mkdir -p .ci-logs
          git config --global --add safe.directory "*"
          git config user.email ci@local
          git config user.name ci
          { echo "job: $GITHUB_JOB ${{ matrix.type }} ${{ matrix.arch }}"; tail -c 30000 /tmp/build.log 2>/dev/null; } > ".ci-logs/linux-${{ matrix.type }}-${{ matrix.arch }}.log"
          git add -f .ci-logs
          git commit -q -m "ci log linux ${{ matrix.type }} ${{ matrix.arch }}" || true
          git push -q -f origin "HEAD:refs/heads/ci-log-linux-${{ matrix.type }}-${{ matrix.arch }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.type }}-${{ matrix.arch }}
          path: build/jpackage/*.${{ matrix.type }}
          if-no-files-found: error

  publish:
    needs: [meta, jars, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list the release assets
        run: ls -l dist

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plus-${{ needs.meta.outputs.core }}-${{ needs.meta.outputs.plus }}
          name: MCA Selector ${{ needs.meta.outputs.core }} - Plus ${{ needs.meta.outputs.plus }}
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            MCA Selector **${{ needs.meta.outputs.core }}** with the Plus layer **${{ needs.meta.outputs.plus }}**.

            Everything upstream does is unchanged; the Plus layer adds world-wide NBT search and
            replace, a data file editor and an NBT file browser. Details, download instructions and
            the build are in [README-PLUS.md](https://github.com/RunningVAN/mca-selector-plus/blob/plus/README-PLUS.md),
            the query syntax and CLI reference in [README-NBT-STUDIO.md](https://github.com/RunningVAN/mca-selector-plus/blob/plus/README-NBT-STUDIO.md).

            ### Downloads

            | platform | file | notes |
            | --- | --- | --- |
            | Windows | `${{ needs.meta.outputs.base }}-setup.exe` | installer, bundled JRE, no Java needed |
            | macOS (Apple silicon) | `${{ needs.meta.outputs.base }}-aarch64.dmg` | bundled JRE |
            | macOS (Intel) | `${{ needs.meta.outputs.base }}-x64.dmg` | bundled JRE |
            | Linux (Debian/Ubuntu) | `${{ needs.meta.outputs.base }}-x64.deb`, `-aarch64.deb` | bundled JRE |
            | Linux (Fedora/RHEL) | `${{ needs.meta.outputs.base }}-x64.rpm`, `-aarch64.rpm` | bundled JRE |
            | any platform | `${{ needs.meta.outputs.base }}-all.jar` | needs JDK 21 with JavaFX |
