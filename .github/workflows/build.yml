name: build

on:
  push:
    branches: [plus]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v4

      - name: build the fat jar
        run: ./gradlew --no-daemon shadowJar

      - name: show the version that went into the jar
        run: |
          JAR=$(ls build/libs/*-plus-*-all.jar | head -1)
          echo "jar: $JAR"
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -E 'Application-Version|Plus-Version'

      - uses: actions/upload-artifact@v4
        with:
          name: mca-selector-plus
          path: build/libs/*-plus-*-all.jar
