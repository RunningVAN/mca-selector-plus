import org.gradle.internal.os.OperatingSystem
import java.nio.file.*

plugins {
	id 'java'
	id 'application'
	id 'eclipse'
	id 'idea'
	id 'org.openjfx.javafxplugin' version '0.1.0'
	id 'com.gradleup.shadow' version '9.2.2'
	id 'com.github.ben-manes.versions' version '0.52.0'
	id 'org.beryx.runtime' version '2.0.1'
}

group = 'net.querz'
compileJava.options.encoding = 'UTF-8'
application.mainClass = 'net.querz.mcaselector.Main'
java.sourceCompatibility = JavaVersion.VERSION_21
// the plus.* keys live in the same file but are owned by this fork, the upstream keys stay untouched
var prop = { String key, String fallback -> project.findProperty(key)?.toString() ?: project.findProperty(fallback).toString() }
var copyright = prop('plus.copyright', 'application.copyright')
// the pipeline is the upstream one (jpackage + Inno Setup, same layout, same keys), but the app image
// and the installer carry the plus name: an installed MCA Selector Plus gets its own folder, its own
// start menu entry and its own uninstaller, so it can live next to an installed upstream MCA Selector
// instead of overwriting it.
var plusApplicationName = project.findProperty('plus.application.name').toString()
// a linux package name has to be lower case and without spaces, a directory in /opt is no place for
// "MCA Selector Plus"; everything else (window title, jar manifest, installer display name) keeps the
// readable form
var plusLinuxName = 'mcaselector-plus'
var matrixType = project.findProperty("matrixType").toString()
var projectName = project.name
var projectVersion = project.version
var plusVersion = project.findProperty('plus.version').toString()

javafx {
	version = "$java.sourceCompatibility"
	modules = ['javafx.controls', 'javafx.swing']
}

idea {
	module.downloadJavadoc = true
	module.downloadSources = true
}

repositories {
	mavenCentral()
	maven { url = 'https://jitpack.io/' }
	maven { url = 'https://plugins.gradle.org/m2/' }
}

dependencies {
	implementation 'com.github.Querz:NBT:13516d666a'
	implementation 'com.google.code.gson:gson:2.12.1'
	implementation 'it.unimi.dsi:fastutil:8.5.15'
	implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
	implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
	implementation 'org.slf4j:slf4j-simple:2.0.19'
	implementation 'commons-cli:commons-cli:1.10.0'
	implementation 'me.tongfei:progressbar:0.10.1'
	implementation 'org.apache.groovy:groovy-jsr223:5.1.2'
	implementation 'org.fxmisc.richtext:richtextfx:0.11.7'
	implementation 'at.yawk.lz4:lz4-java:1.9.0'
	implementation 'org.atteo.classindex:classindex:3.13'
	implementation 'io.github.pcmind:leveldb:1.2'

	annotationProcessor('org.atteo.classindex:classindex:3.13')
	annotationProcessor('org.apache.logging.log4j:log4j-core:2.26.1')

	testImplementation(platform('org.junit:junit-bom:6.0.1'))
	testImplementation('org.junit.jupiter:junit-jupiter')
	testImplementation('org.reflections:reflections:0.10.2')
	testImplementation('commons-io:commons-io:2.18.0')
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
	// the launcher API is implemented by FxTestLauncherSessionListener, which keeps the JavaFX
	// toolkit alive for the whole run instead of letting the first window-closing test shut it down
	testImplementation('org.junit.platform:junit-platform-launcher')
}

compileJava {
	options.compilerArgs += [
		'-Xlint:deprecation',
		'-Xlint:unchecked',
		"-Alog4j.graalvm.groupId=${project.group}",
		"-Alog4j.graalvm.artifactId=${project.name}"
	]
}

tasks.register('minifyCss') {
	dependsOn processResources
	doLast {
		var styleDir = Path.of("${sourceSets.main.resources.srcDirs[0]}", "style")
		Files.find(styleDir, Integer.MAX_VALUE, (filePath, fileAttr) -> fileAttr.isRegularFile())
			.forEach(p -> {
				minCss(p, Path.of("${sourceSets.main.output.resourcesDir}", "style", styleDir.relativize(p).toString()))
			})
	}
}

tasks.register('generator', JavaExec) {
	mainClass = 'net.querz.mcaselector.version.mapping.generator.Main'
	classpath = sourceSets.main.runtimeClasspath
}

jar {
	dependsOn minifyCss
	archiveFileName = "${projectName}-${projectVersion}.jar"
	manifest.attributes (
		'Main-Class': application.mainClass,
		'Application-Version': projectVersion,
		'Plus-Version': plusVersion,
		'Copyright': copyright,
		'Class-Path': configurations.shadow.files.stream()
				.filter($it -> !$it.name.startsWith('javafx')).collect{"lib/$it.name"}.join(' ')
	)
	exclude 'licenses/'
	from 'LICENSE'
}

shadowJar {
	archiveFileName = "${projectName}-${projectVersion}-all.jar"
	minimize {
		exclude(dependency('org.apache.logging.log4j:log4j-core:.*'))
		exclude(dependency('org.apache.groovy:groovy-jsr223:.*'))
		exclude(dependency('org.lz4:lz4-java:.*'))
	}
	dependencies {
		exclude(dependency(':javafx.*:.*'))
	}
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	manifest.attributes (
		'Main-Class': application.mainClass,
		'Application-Version': projectVersion,
		'Plus-Version': plusVersion,
		'Copyright': copyright
	)
	from 'LICENSE'
}

runtime {
	options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
	modules = [
		'java.base',
		'java.desktop',
		'java.management',
		'java.naming',
		'java.scripting',
		'jdk.unsupported',
		'javafx.controls',
		'javafx.swing',
		'jdk.crypto.ec'
	]

	jpackage {
		jvmArgs = ['-Xmx4096m']
		if (OperatingSystem.current().isWindows()) {
			imageName = plusApplicationName
			skipInstaller = true
			imageOptions = [
				'--icon', 'installer/windows/icon.ico',
				'--copyright', copyright
			]
		} else if (OperatingSystem.current().isMacOsX()) {
			installerType = "dmg"
			// "MCA Selector Plus.app" and "MCA Selector Plus-x.y.dmg", not "MCA Selector ...",
			// so the bundle sits next to the upstream one in /Applications
			imageName = plusApplicationName
			installerName = plusApplicationName
			imageOptions = [
				'--icon', 'installer/macos/icon.icns',
				'--copyright', copyright
			]
			installerOptions = [
				'--icon', 'installer/macos/icon.icns',
				'--copyright', copyright,
				'--license-file', 'build/licenses/LICENSE'
			]
		} else if (OperatingSystem.current().isLinux()) {
			installerType = matrixType ?: "deb"
			// install into /opt/mcaselector-plus and name the deb/rpm mcaselector-plus instead of
			// mcaselector. The installer stage takes --name from installerName (default:
			// project.name), so it must be set too or the package stays "mcaselector".
			imageName = plusLinuxName
			installerName = plusLinuxName
			imageOptions = [
				'--icon', 'installer/linux/icon.png',
				'--copyright', copyright,
			]
			installerOptions = [
				'--linux-shortcut',
				'--icon', 'installer/linux/icon.png',
				'--copyright', copyright,
				'--resource-dir', 'installer/linux',
				'--license-file', 'build/licenses/LICENSE'
			]
		}
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
	systemProperties = [
		'junit.jupiter.tempdir.cleanup.mode.default': 'NEVER',
		'net.querz.test.temp.dir': 'test_output' // if set, use this dir as temp dir
	]
}

// ---------------------------------------------------------------------------------------------------------------------

/**
 * "Minifies" a css file by removing all comments, \n, \t and all duplicate spaces.
 *
 * @param i The input css file
 * @param o The output css file
 * @throws IOException If something goes wrong during reading or writing
 */
static minCss(i, o) throws IOException {
	String s = Files.readString(i)
	s = s.replace("\t", "").replace("\r\n", " ").replace("\n", " ").replaceAll("/\\*.*?\\*/", "").replaceAll(" {2,}", " ").trim()
	try {Files.writeString(o, s)}
	catch (Exception ex) {
		ex.printStackTrace()
	}
}